    <rect x="758" y="146" width="205" height="34" rx="17" fill="#11283a" stroke="#24506a"/>
    <circle cx="779" cy="163" r="5" fill="#48e0a4"/>
    <text x="794" y="169" class="cyan">deepseek-v4-flash</text>

    <rect x="978" y="146" width="118" height="34" rx="17" fill="#322817" stroke="#72582b"/>
    <text x="997" y="169" class="amber">MODE: ASK</text>

