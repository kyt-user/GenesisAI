<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1627"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e6a8"/>
      <stop offset="1" stop-color="#42bff5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "Cascadia Mono", "JetBrains Mono", "Microsoft YaHei UI", monospace; }
      .sans { font-family: Inter, "Microsoft YaHei UI", "Segoe UI", sans-serif; }
      .muted { fill: #76869d; }
      .soft { fill: #aebbd0; }
      .bright { fill: #e9f2ff; }
      .green { fill: #48e0a4; }
      .cyan { fill: #55c7f3; }
      .amber { fill: #ffc760; }
      .red { fill: #ff7b83; }
      .tiny { font-size: 16px; }
      .small { font-size: 18px; }
      .base { font-size: 20px; }
      .medium { font-size: 22px; }
      .title { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#040912"/>
  <circle cx="140" cy="170" r="240" fill="#0b4e49" opacity="0.18"/>
  <circle cx="1480" cy="980" r="300" fill="#123e67" opacity="0.17"/>

  <g filter="url(#shadow)">
    <rect x="55" y="42" width="1490" height="1036" rx="22" fill="url(#bg)" stroke="#26364c" stroke-width="2"/>
    <rect x="55" y="42" width="1490" height="58" rx="22" fill="#101c2d"/>
    <rect x="55" y="79" width="1490" height="21" fill="#101c2d"/>
  </g>

  <!-- Window chrome -->
  <circle cx="88" cy="71" r="7" fill="#ff6b74"/>
  <circle cx="113" cy="71" r="7" fill="#ffc45c"/>
  <circle cx="138" cy="71" r="7" fill="#47d597"/>
  <text x="800" y="78" text-anchor="middle" class="mono small soft">GenesisAI — D:\Projects\my-app</text>

