  <g transform="translate(108,149)">
    <path d="M24 0 L48 24 L24 48 L0 24 Z" fill="none" stroke="url(#brand)" stroke-width="4"/>
    <circle cx="24" cy="24" r="7" fill="#48e0a4" filter="url(#glow)"/>
  </g>
  <text x="174" y="167" class="sans title bright">GENESISAI</text>
  <text x="174" y="198" class="mono small muted">single-agent developer CLI · session 7F2A</text>

