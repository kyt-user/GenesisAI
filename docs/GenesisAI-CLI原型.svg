  <text x="134" y="954" class="mono tiny soft">修复工具注册表的重复名称校验；修改 1 个文件（+12 −4）。</text>
  <text x="134" y="982" class="mono tiny soft">验证：8 passed   ·   Memory：已记录测试命令   ·   输入 /diff 查看完整变更</text>

