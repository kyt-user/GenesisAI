  <text x="134" y="421" class="mono tiny muted">按需加载：</text>
  <text x="245" y="421" class="mono tiny green">file_search</text>
  <text x="365" y="421" class="mono tiny green">file_read</text>
  <text x="462" y="421" class="mono tiny green">apply_patch</text>
  <text x="582" y="421" class="mono tiny green">test_run</text>
  <text x="680" y="421" class="mono tiny green">git_diff</text>

  <!-- Timeline -->
  <line x1="127" y1="468" x2="127" y2="776" stroke="#2c4159" stroke-width="2"/>

  <circle cx="127" cy="478" r="7" fill="#48e0a4"/>
  <text x="153" y="485" class="mono small bright">搜索测试失败位置</text>
