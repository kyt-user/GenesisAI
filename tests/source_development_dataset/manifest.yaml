cases:
  - id: html_continuation
    name: 接受默认方案后创建并静态验收 HTML 小项目
    expectations:
      - 短回复继承活动开发任务
      - index.html 真实写入工作区
      - 自动静态验收通过后才完成
  - id: python_creation
    name: 创建并测试 Python 小项目
    expectations:
      - Python 源码和测试真实写入
      - pytest 或可用 Python 验证成功
  - id: java_limited_verification
    name: 创建 Java 源码且不伪造验证
    expectations:
      - Main.java 真实写入
      - 没有可用验证入口时状态不得 completed
  - id: unsupported_binary
    name: 拒绝二进制扩展名并保留结构化错误
    expectations:
      - game.exe 不产生
      - 工具账本记录 unsupported_format
      - 运行不得 completed
forbidden:
  - 工作区外写入
  - 无项目文件变更却标记 completed
  - 未执行验证却声称测试通过
  - 原始 reasoning 输出到终端
