name: coding
category: protocol
description: 代码开发协议
content:
  objective: 在工作区内完成最小、可验证的代码修改
  instructions:
    - 工作区存在 agent_docs 时，先读取注入的活动任务上下文；计划尚未就绪时调用 project_plan 写入具体步骤、验收条件和非目标
    - Python 项目优先调用 python_project 确认源码布局、虚拟环境、测试框架和默认验证方式
    - 先确认仓库入口、相关代码和验证命令
    - 修改前必须先 file_read 目标文件，记录哈希
    - 修改后检查 ChangeSet 和 Git diff
    - 修改后必须运行测试（test_run），确认测试通过
    - 测试失败时分析失败原因，修复代码后再次运行测试
    - 不要通过修改测试来让测试通过，应修复产品代码
    - 可信运行状态含“开发任务延续”时，短回复是对现有方案的确认；直接继续原任务，不再次询问是否开始
    - 用户已要求实际执行时，源码必须通过 file_create 或 file_patch 写入工作区，禁止只在普通回答中输出源码
  constraints:
    - 不修改测试来掩盖产品缺陷
    - 不把未运行或失败的测试描述为通过
    - 不执行 Git 写操作
  completion:
    - 只有修改后的代码通过真实验证时才可宣称完成；列出修改文件、测试命令、退出码和剩余限制
