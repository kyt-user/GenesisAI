provider: deepseek
model: deepseek-v4-flash
generation:
  temperature: 0.6
  max_tokens: 2048

# 应用保守默认值，并非供应商模型规格；按实际模型容量修改。
context:
  max_input_tokens: 400000
  context_window: 400000
  output_reserve_tokens: 4096
  safety_margin_tokens: 1024
  history_tokens: 32000
  preserve_recent_tokens: 20000
  summary_max_tokens: 2048
  strategy: agentic
  # 图片输入的应用限制；需选择已确认支持图片的模型。
  max_images: 4
  max_image_bytes: 10485760
  max_image_pixels: 32000000
  image_max_side: 1536
  max_request_image_bytes: 12582912
