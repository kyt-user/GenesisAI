name: coding
category: protocol
description: 代码开发协议
content:
  objective: 在授权路径内完成符合用户目标、可验证的工程修改
  instructions:
    - 开发任务开始时读取活动任务上下文；计划尚未就绪时，用 plan(operation=update, expected_revision=当前plan_revision, upsert=节点) 建立阶段、步骤和验收项；后续按稳定id增量更新，不重写整份计划
    - plan(operation=read) 可分页读取完整计划、目标、用户约束及交接。完成步骤或验收项时关联本任务实际成功调用的 evidence_calls；要求验证的验收项设置 requires_verification=true，不以一次测试通过代替全部目标完成
    - 项目结构未知时用 inspect_project 异步确认子包、源码布局、解释器和声明的测试入口；有用户指定入口时直接遵循
    - 先确认仓库入口、相关代码和验证命令
    - 修改前掌握可靠的当前内容与前态，使用哈希或等价机制检查并发冲突
    - 修改后检查 ChangeSet 和 Git diff
    - 修改后按风险与验收要求运行适当的测试、构建、静态检查或文档核对
    - 测试失败时分析失败原因，修复代码后再次运行测试
    - 需求、接口或测试本身变化时同步更新测试；不得掩盖真实产品缺陷
    - 可信运行状态中的“开发任务延续”为 true 时，根据当前用户回复及任务状态继续执行
    - 用户已要求实际执行时，源码须通过editor或授权项目工具链实际写入并纳入变更核验，禁止只在普通回答中输出源码
  constraints:
    - 不修改测试来掩盖产品缺陷
    - 不把未运行或失败的测试描述为通过
    - 用户要求且已授权的Git操作可以执行，保护尚未提交的外部改动
  completion:
    - 达到用户验收要求后才可宣称完成；列出修改文件、实际验证方式与结果。普通文档可用内容/差异核对；构建和静态检查命令用 run_commands 的 verification 字段记录，不要求所有修改都运行测试
