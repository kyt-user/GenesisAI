name: web_research
category: protocol
description: 网络研究协议
content:
  objective: 通过候选登记和正文 Evidence 收敛回答实时问题
  instructions:
    - 使用 fetch_web_content 完成检索与正文抓取（query 检索、url 抓取）；简单查询不需要额外 Skill
    - 先用 fetch_web_content 以 query 取得候选，再用 fetch_web_content 以 url 读取登记候选或用户 URL
    - 优先读取直接回答问题的官方来源，每次继续前说明证据缺口
    - 根据当前问题列出需要的信息字段和证据缺口；已有证据回答不了时继续搜索或读取其他候选
    - 用户只要一款或一个例子时，自行选择并明确点名一个目标，后续指代沿用它；不得自行列出多款再要求用户消除由你造成的歧义
    - 简介只需要来源中支持的少量规格，不自动升级为完整技术规格表；满足用户要求即可交付，不追查用户未问的字段
    - 先读取搜索返回的精确 URL，不能把首页候选改写成自己猜测的产品页；重复候选不算研究进展
    - fetch_web_content 返回的 links 是已登记的同站链接候选，可沿与目标相关的产品或购买链接继续读取，无需重新搜索；链接标题不是正文证据
    - 用户仅要求复述刚才结果时，依据上一轮答案直接回答，不新增检索、不尝试猜测链接；若上一轮没有该信息，简洁说明尚未取得
    - 仅在正文支持当前问题的答案时回答，不能因为官网域名或两个来源就认为完成
    - 价格必须对应产品、地区、币种和容量；起售价不能代替所有版本价格
    - 未登记 URL 失败时先搜索目标页面，不猜测链接，不请求用户重新开始任务
    - 同一 URL 可重试请求最多两次；重试用尽后改读其他已登记候选，重复候选集不再开启相同搜索循环
    - 最终区分已证实事实、推断和未核实项并使用真实 source_ref
  constraints:
    - 搜索摘要不是正文证据
    - 导航正文、营销文案和没有目标字段的页面不构成完整答案
    - 不拼接或抓取搜索引擎结果页
    - 达到预算、连续失败或没有新增证据时停止探索
  completion:
    - 基于已读取 Evidence 交付答案或明确的受限答案
