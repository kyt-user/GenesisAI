name: web_research
category: protocol
description: 网络研究协议
content:
  objective: 通过实际读取的来源核实实时信息
  instructions:
    - 使用 fetch_web_content 完成检索与正文抓取（query 检索、url 抓取）；简单查询不需要额外 Skill
    - 需要发现来源时用query检索；已有合法URL时可直接用url读取，登记仅用于溯源
    - 优先读取直接回答问题的官方来源，每次继续前说明证据缺口
    - 根据当前问题列出需要的信息字段和证据缺口；已有证据回答不了时继续搜索或读取其他候选
    - 用户只要一款或一个例子时，自行选择并明确点名一个目标，后续指代沿用它；不得自行列出多款再要求用户消除由你造成的歧义
    - 简介只需要来源中支持的少量规格，不自动升级为完整技术规格表；满足用户要求即可交付，不追查用户未问的字段
    - 优先读取精确来源URL；推导链接须实际读取验证，不把猜测地址当已取得证据
    - fetch_web_content 可发现跨站链接；用section=links与offset分页查看完整候选，发现不授予访问权限，链接标题不是正文证据
    - 检索可指定result_count、offset、provider及过滤条件；续页使用返回的next_offset并保持provider，coverage说明提供商实际覆盖边界
    - 网页完整源保留；用section=text/source读取正文或原文，structured/structured_raw按block查看事实与原始块，document_pages/page按页读取PDF，依据next_offset继续，不把首个片段当全文
    - 返回job_id且状态仍queued/running时，用read_job观察原作业；完成收取source_refs前不能当已读证据，不重复提交同一操作
    - 用户仅要求复述刚才结果时，依据上一轮答案直接回答，不新增检索、不尝试猜测链接；若上一轮没有该信息，简洁说明尚未取得
    - 仅在正文支持当前问题的答案时回答，不能因为官网域名或两个来源就认为完成
    - 价格必须对应产品、地区、币种和容量；起售价不能代替所有版本价格
    - 费用合计、单价乘数量或汇率换算用calculate_price绑定操作数来源，引用派生来源并说明公式；用户给定值须标注基于用户给定前提，不能宣称已核实市场价
    - MCP 搜索结果中的条目或原文链接可作为候选。价格要读取相关正文核对，并引用返回的 source_ref。
    - 判断「最划算」需比较满足同一用途的选项，并对齐计费单位及输入、输出等用量口径。只有单款报价或降价报道时，给出已核实事实并以 [[PARTIAL]] 说明缺少哪些比较依据。
    - 临时失败按错误类型重试或换来源；重复无效动作不算研究进展
    - 最终区分已证实事实、推断和未核实项并使用真实 source_ref
  constraints:
    - 搜索摘要不是正文证据
    - 导航正文、营销文案和没有目标字段的页面不构成完整答案
    - 遵守用户显式预算；无法推进时说明具体阻塞，分析已有证据不等于停滞
  completion:
    - 基于已读取 Evidence 交付答案或明确的受限答案
