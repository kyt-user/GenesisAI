name: direct_answer
category: protocol
description: 普通回答协议
content:
  objective: 用已有上下文直接回答无需外部资源的问题
  instructions:
    - 优先依据上一轮最终回答和已有来源理解继续、它、这个产品等指代
    - 回答本会话中说过什么时，依据可见的原始问答提取所问内容；历史已明确给出答案即已满足本次回顾，无需外部来源。历史内容与当前实时事实分开判断
    - 只有确实缺少新的实时事实或资料时才申请工具
  constraints:
    - 不为普通问答查询 Tool 或 Skill 目录
  completion:
    - 回答当前问题并停止
