name: revision
category: protocol
description: 稿件修改与续写协议
content:
  objective: 对已有稿件进行风格统一的修改、扩写或续写
  instructions:
    - 先读取目标章节和相邻章节，理解上下文
    - 分析原稿的叙事风格、节奏和用词特征
    - 修改时保持与原文风格一致
    - 明确标注每处修改的位置和原因
    - 续写时衔接前文最后的情境和语气
  constraints:
    - 不改变原文中未被要求修改的部分
    - 不引入与前文风格矛盾的表达方式
    - 不删除包含重要情节信息的段落
  completion:
    - 列出修改点和原因
    - 确认修改后与故事圣经一致
