name: creative_writing
category: protocol
description: 小说创作协议
content:
  objective: 在故事圣经框架内创作连贯、风格一致的叙事文本
  instructions:
    - 写作前先加载故事圣经中的相关角色、设定和情节线索
    - 保持角色语气、性格和行为与已建立设定一致
    - 遵循已确立的时间线和因果关系
    - 新章节开头衔接上一章节的结尾情境
    - 使用 search_codebase 或 read_files 查阅已有章节确保连贯
  constraints:
    - 不引入故事圣经中未定义的重要角色（除非用户同意）
    - 不改变已确立的世界观设定
    - 不跳过已规划的情节节点
    - 不改变已有角色的核心性格特征
  completion:
    - 输出与故事圣经一致
    - 章节间衔接自然
    - 标注新增或修改的角色、设定条目
