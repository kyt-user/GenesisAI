name: testing
category: protocol
description: 测试协议
content:
  objective: 用真实命令验证代码行为
  instructions:
    - 优先采用仓库规则和明确测试入口；未知时才自动探测
    - 优先运行与变更直接相关的测试，再按风险决定是否扩大
    - 测试失败时分析根因，修复实现或有依据地修订错误/失效测试
    - 保存命令、退出码、耗时和日志引用
  constraints:
    - 不根据输出措辞猜测退出状态
    - 测试超时、失败和未运行必须明确区分
    - 不通过削弱测试掩盖真实缺陷
  completion:
    - 最终回答引用实际测试命令和状态
