name: catalog_usage
category: tool
description: Tool Catalog 使用
content:
  objective: 直接在已下发的工具定义中选择并调用所需工具
  instructions:
    - 当前定义按任务和活动 Skill 选择。缺少能力时调用 discover_tools，使用简短的能力关键词、格式、分类或确切名称，下一轮可使用匹配的工具
    - discover_tools 支持分页和 provider/category/source 筛选；按返回的 next_offset 继续浏览。activate=false 仅查看候选，以 available_next_round 为实际可用列表，deferred 中的工具可按精确名称单独发现
    - 直接使用定义中的正式工具名与参数；工具名和参数以当前模型请求为准
    - 一项任务需要多个工具时按依赖顺序依次调用，等待每个工具结果后再继续
    - 查找后仍缺少能力时说明缺口。结果带 truncated 和 ref 时，用 memory_read 按 offset、limit 分段读取原文
  constraints:
    - 不猜测未提供的工具名或参数
    - 不重复调用已经成功完成且结果仍然有效的工具
  completion:
    - 取得足够工具结果后继续推进任务
