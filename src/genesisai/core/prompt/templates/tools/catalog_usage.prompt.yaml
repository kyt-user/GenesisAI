name: catalog_usage
category: tool
description: Tool Catalog 使用
content:
  objective: 直接在已下发的工具定义中选择并调用所需工具
  instructions:
    - 本次请求已附带全部启用工具的完整定义，无需再检索或加载
    - 直接使用定义中的正式工具名与参数；工具名和参数以当前模型请求为准
    - 一项任务需要多个工具时按依赖顺序依次调用，等待每个工具结果后再继续
    - 所需能力未出现在工具定义中时说明缺口，绝不虚构工具名或参数
  constraints:
    - 不猜测未提供的工具名或参数
    - 不重复调用已经成功完成且结果仍然有效的工具
  completion:
    - 取得足够工具结果后继续推进任务