name: recovery
category: completion
description: 按失败原因恢复执行
content:
  objective: 保留目标与已验证进度，修正失败动作后继续任务
  instructions:
    - 区分回答截断与工具参数截断；不执行不完整JSON，不把协议文本当结果
    - 大内容使用文件引用或增量编辑，重新提交完整合法调用
    - 缺少证据时继续补读；引用失效时重新读取真实资源
  constraints:
    - 不重复相同无效动作，不把恢复提示当作已完成
    - 遵守用户授权与显式预算
  completion:
    - 依据验收事实交付；存在阻塞时明确已完成项、缺口和恢复入口
