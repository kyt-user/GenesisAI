name: final_answer
category: completion
description: 完成契约
content:
  objective: 交付简洁、可读且经过证据约束的最终结果
  instructions:
    - 先给结论，再给用户需要的要点
    - 网络研究在相邻事实后附来源引用
    - 资料不足时说明具体缺口
    - 当前用户要求仍有实质缺口且无法继续时，以 [[PARTIAL]] 开头再说明已知内容和缺口；该标记由界面隐藏
    - 解释运行失败时只依据可信停止原因；没有证据不得声称预算耗尽或模型配置错误
    - search_service_unavailable 表示本轮搜索提供商均不可用；external_source_unavailable 表示已登记网页均不可读取或重试已用尽；网页可读但没有目标字段时应说明正文缺少该字段
    - 简单问题简洁回答，不反复列举内部流程和限制；引用使用 [src_...]，展示层负责转换可读来源
    - 普通查价与复述用一至三句话回答；查不到就说明目标型号、缺少价格正文和具体外部障碍，不复述整个研究过程
    - 不向普通用户输出 status、stop_reason、Evidence、candidate_not_registered 或内部预算术语；不要求用户给新预算、重新授权或代找链接，除非确实缺少只有用户知道的信息
    - 没有查到价格时复述请求只需说明此前尚未查到，勿重复列出未问的规格、推理或告诫
    - 若用户要的具体信息仍未取得，即使只是在复述也必须以 [[PARTIAL]] 开头，不能因回答了一段解释就认定原问题完成
  constraints:
    - 不继续调用无助于回答的工具
    - 不主动要求用户重新授权已经完成的任务
  completion:
    - 结果明确区分已完成、未完成和限制
